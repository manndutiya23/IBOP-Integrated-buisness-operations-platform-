<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1700 1100" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">IBOP UML Use Case Diagram - Balanced Layout</title>
  <desc id="desc">Balanced UML use case diagram for Shrinath Enterprises based strictly on the implemented IBOP project.</desc>

  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .boundary { fill: #ffffff; stroke: #94a3b8; stroke-width: 2.2; }
      .title { font: 700 26px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px Arial, sans-serif; fill: #475569; }
      .section { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .actor-label { font: 700 15px Arial, sans-serif; fill: #0f172a; }
      .actor-line { stroke: #334155; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .assoc { stroke: #475569; stroke-width: 1.6; fill: none; }
      .include { stroke: #64748b; stroke-width: 1.45; fill: none; stroke-dasharray: 7 5; }
      .uc { fill: #ffffff; stroke: #1d4ed8; stroke-width: 2; }
      .uc-text { font: 600 15px Arial, sans-serif; fill: #0f172a; }
      .note { font: 400 12px Arial, sans-serif; fill: #64748b; }
    </style>
    <marker id="openArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L9,4 L1,7" fill="none" stroke="#64748b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1700" height="1100"/>

  <text class="title" x="850" y="54" text-anchor="middle">Integrated Business Operations Platform (IBOP)</text>
  <text class="subtitle" x="850" y="78" text-anchor="middle">UML Use Case Diagram for Shrinath Enterprises</text>
  <text class="note" x="850" y="102" text-anchor="middle">Inventory Manager is the academic label used for the implemented Supply Chain role.</text>

  <rect class="boundary" x="260" y="130" width="1180" height="760" rx="22"/>
  <text class="section" x="850" y="158" text-anchor="middle">IBOP System Boundary</text>

  <!-- Use cases -->
  <g>
    <ellipse class="uc" cx="850" cy="220" rx="92" ry="34"/>
    <text class="uc-text" x="850" y="225" text-anchor="middle">Login</text>
  </g>

  <g>
    <ellipse class="uc" cx="850" cy="340" rx="110" ry="34"/>
    <text class="uc-text" x="850" y="335" text-anchor="middle">
      <tspan x="850" dy="0">View</tspan>
      <tspan x="850" dy="17">Dashboard</tspan>
    </text>
  </g>

  <g>
    <ellipse class="uc" cx="470" cy="250" rx="108" ry="34"/>
    <text class="uc-text" x="470" y="245" text-anchor="middle">
      <tspan x="470" dy="0">Manage</tspan>
      <tspan x="470" dy="17">Inventory</tspan>
    </text>
  </g>

  <g>
    <ellipse class="uc" cx="470" cy="355" rx="92" ry="30"/>
    <text class="uc-text" x="470" y="360" text-anchor="middle">Add Products</text>
  </g>

  <g>
    <ellipse class="uc" cx="470" cy="460" rx="94" ry="30"/>
    <text class="uc-text" x="470" y="465" text-anchor="middle">Update Stock</text>
  </g>

  <g>
    <ellipse class="uc" cx="470" cy="565" rx="136" ry="30"/>
    <text class="uc-text" x="470" y="570" text-anchor="middle">Monitor Product Availability</text>
  </g>

  <g>
    <ellipse class="uc" cx="470" cy="700" rx="108" ry="34"/>
    <text class="uc-text" x="470" y="695" text-anchor="middle">
      <tspan x="470" dy="0">Manage</tspan>
      <tspan x="470" dy="17">Employees</tspan>
    </text>
  </g>

  <g>
    <ellipse class="uc" cx="1230" cy="250" rx="92" ry="34"/>
    <text class="uc-text" x="1230" y="255" text-anchor="middle">Create Sale</text>
  </g>

  <g>
    <ellipse class="uc" cx="1230" cy="355" rx="104" ry="34"/>
    <text class="uc-text" x="1230" y="350" text-anchor="middle">
      <tspan x="1230" dy="0">Generate</tspan>
      <tspan x="1230" dy="17">Invoice</tspan>
    </text>
  </g>

  <g>
    <ellipse class="uc" cx="1230" cy="485" rx="110" ry="34"/>
    <text class="uc-text" x="1230" y="480" text-anchor="middle">
      <tspan x="1230" dy="0">Record</tspan>
      <tspan x="1230" dy="17">Purchases</tspan>
    </text>
  </g>

  <g>
    <ellipse class="uc" cx="1230" cy="620" rx="96" ry="34"/>
    <text class="uc-text" x="1230" y="625" text-anchor="middle">Track Expenses</text>
  </g>

  <g>
    <ellipse class="uc" cx="1230" cy="745" rx="128" ry="34"/>
    <text class="uc-text" x="1230" y="740" text-anchor="middle">
      <tspan x="1230" dy="0">View Financial</tspan>
      <tspan x="1230" dy="17">Analytics</tspan>
    </text>
  </g>

  <!-- Actors -->
  <g transform="translate(850 78)">
    <circle class="actor-line" cx="0" cy="0" r="12"/>
    <line class="actor-line" x1="0" y1="12" x2="0" y2="48"/>
    <line class="actor-line" x1="-18" y1="24" x2="18" y2="24"/>
    <line class="actor-line" x1="0" y1="48" x2="-16" y2="72"/>
    <line class="actor-line" x1="0" y1="48" x2="16" y2="72"/>
    <text class="actor-label" x="0" y="98" text-anchor="middle">Admin</text>
  </g>

  <g transform="translate(90 320)">
    <circle class="actor-line" cx="0" cy="0" r="12"/>
    <line class="actor-line" x1="0" y1="12" x2="0" y2="48"/>
    <line class="actor-line" x1="-18" y1="24" x2="18" y2="24"/>
    <line class="actor-line" x1="0" y1="48" x2="-16" y2="72"/>
    <line class="actor-line" x1="0" y1="48" x2="16" y2="72"/>
    <text class="actor-label" x="0" y="98" text-anchor="middle">HR Employee</text>
  </g>

  <g transform="translate(90 620)">
    <circle class="actor-line" cx="0" cy="0" r="12"/>
    <line class="actor-line" x1="0" y1="12" x2="0" y2="48"/>
    <line class="actor-line" x1="-18" y1="24" x2="18" y2="24"/>
    <line class="actor-line" x1="0" y1="48" x2="-16" y2="72"/>
    <line class="actor-line" x1="0" y1="48" x2="16" y2="72"/>
    <text class="actor-label" x="0" y="98" text-anchor="middle">Inventory Manager</text>
  </g>

  <g transform="translate(1610 320)">
    <circle class="actor-line" cx="0" cy="0" r="12"/>
    <line class="actor-line" x1="0" y1="12" x2="0" y2="48"/>
    <line class="actor-line" x1="-18" y1="24" x2="18" y2="24"/>
    <line class="actor-line" x1="0" y1="48" x2="-16" y2="72"/>
    <line class="actor-line" x1="0" y1="48" x2="16" y2="72"/>
    <text class="actor-label" x="0" y="98" text-anchor="middle">Sales Employee</text>
  </g>

  <g transform="translate(1610 660)">
    <circle class="actor-line" cx="0" cy="0" r="12"/>
    <line class="actor-line" x1="0" y1="12" x2="0" y2="48"/>
    <line class="actor-line" x1="-18" y1="24" x2="18" y2="24"/>
    <line class="actor-line" x1="0" y1="48" x2="-16" y2="72"/>
    <line class="actor-line" x1="0" y1="48" x2="16" y2="72"/>
    <text class="actor-label" x="0" y="98" text-anchor="middle">Finance Employee</text>
  </g>

  <g transform="translate(1610 490)">
    <circle class="actor-line" cx="0" cy="0" r="12"/>
    <line class="actor-line" x1="0" y1="12" x2="0" y2="48"/>
    <line class="actor-line" x1="-18" y1="24" x2="18" y2="24"/>
    <line class="actor-line" x1="0" y1="48" x2="-16" y2="72"/>
    <line class="actor-line" x1="0" y1="48" x2="16" y2="72"/>
    <text class="actor-label" x="0" y="98" text-anchor="middle">Management</text>
  </g>

  <!-- Associations -->
  <line class="assoc" x1="850" y1="90" x2="850" y2="186"/>
  <line class="assoc" x1="850" y1="90" x2="850" y2="306"/>
  <line class="assoc" x1="850" y1="90" x2="578" y2="250"/>
  <line class="assoc" x1="850" y1="90" x2="1120" y2="250"/>
  <line class="assoc" x1="850" y1="90" x2="1122" y2="485"/>
  <line class="assoc" x1="850" y1="90" x2="1118" y2="620"/>
  <line class="assoc" x1="850" y1="90" x2="578" y2="700"/>
  <line class="assoc" x1="850" y1="90" x2="1118" y2="745"/>
  <line class="assoc" x1="850" y1="90" x2="1122" y2="355"/>

  <line class="assoc" x1="122" y1="320" x2="362" y2="700"/>
  <line class="assoc" x1="122" y1="320" x2="362" y2="250"/>

  <line class="assoc" x1="122" y1="620" x2="362" y2="250"/>
  <line class="assoc" x1="122" y1="620" x2="362" y2="355"/>
  <line class="assoc" x1="122" y1="620" x2="362" y2="460"/>
  <line class="assoc" x1="122" y1="620" x2="334" y2="565"/>
  <line class="assoc" x1="122" y1="620" x2="362" y2="485"/>

  <line class="assoc" x1="1598" y1="320" x2="1356" y2="250"/>
  <line class="assoc" x1="1598" y1="320" x2="1352" y2="355"/>
  <line class="assoc" x1="1598" y1="320" x2="1350" y2="340"/>

  <line class="assoc" x1="1598" y1="660" x2="1356" y2="620"/>
  <line class="assoc" x1="1598" y1="660" x2="1358" y2="745"/>
  <line class="assoc" x1="1598" y1="660" x2="1352" y2="340"/>

  <line class="assoc" x1="1598" y1="490" x2="1118" y2="340"/>
  <line class="assoc" x1="1598" y1="490" x2="1358" y2="745"/>

  <!-- Include relationships -->
  <line class="include" x1="470" y1="284" x2="470" y2="321" marker-end="url(#openArrow)"/>
  <line class="include" x1="470" y1="284" x2="470" y2="430" marker-end="url(#openArrow)"/>
  <line class="include" x1="470" y1="284" x2="470" y2="534" marker-end="url(#openArrow)"/>
  <line class="include" x1="470" y1="284" x2="470" y2="670" marker-end="url(#openArrow)"/>

  <line class="include" x1="1230" y1="284" x2="1230" y2="321" marker-end="url(#openArrow)"/>
  <line class="include" x1="1230" y1="384" x2="1230" y2="451" marker-end="url(#openArrow)"/>

  <text class="note" x="850" y="928" text-anchor="middle">All use cases shown correspond to functionality implemented in the repository.</text>
</svg>
